# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy both a PostgreSQL database and a Django web service automatically.

databases:
  - name: techplus-db
    databaseName: techplus
    user: techplus_user
    plan: free
    region: singapore  # Change to: oregon / frankfurt / ohio to match your users

services:
  - type: web
    name: techplus-web
    runtime: python
    region: singapore  # Must match the database region above
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn Core.wsgi:application --workers 2 --threads 2 --timeout 120"

    # Auto-deploy whenever you push to the main branch
    autoDeploy: true

    envVars:
      # ── Database ───────────────────────────────────────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: techplus-db
          property: connectionString

      # ── Django Core ───────────────────────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true   # Render generates a strong random secret automatically

      - key: PYTHON_VERSION
        value: 3.11.0

      # ── Cloudinary (Media Files) ───────────────────────────────────────────────
      # Set these manually in the Render dashboard → Environment tab
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Brevo Email ────────────────────────────────────────────────────────────
      # Set these manually in the Render dashboard → Environment tab
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "TechPlus <noreply@techplus.io>"

      # AI Chatbot
      - key: GEMINI_API_KEY
        sync: false
