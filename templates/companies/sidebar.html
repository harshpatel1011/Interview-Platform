<!-- Sidebar -->
<div class="md:col-span-1 space-y-6 sticky top-24 self-start">
    <div class="premium-card p-6 border border-white/5 bg-[#050505]">
        <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-4">Quick Actions</h3>
        <div class="flex flex-col gap-3">
            <a href="{% url 'company_dashboard' %}" class="flex items-center justify-between p-3 rounded bg-white/5 hover:bg-white/10 transition border border-white/5 group">
                <div class="flex items-center gap-3 text-sm {% if request.resolver_match.url_name == 'company_dashboard' %}text-white font-bold{% else %}text-gray-300 group-hover:text-white{% endif %} transition">
                    <i class="fa-solid fa-chart-line text-blue-400"></i> Dashboard
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-gray-600"></i>
            </a>
            <a href="{% url 'company_marketplace' %}" class="flex items-center justify-between p-3 rounded bg-white/5 hover:bg-white/10 transition border border-white/5 group">
                <div class="flex items-center gap-3 text-sm {% if request.resolver_match.url_name == 'company_marketplace' %}text-white font-bold{% else %}text-gray-300 group-hover:text-white{% endif %} transition">
                    <i class="fa-solid fa-store text-emerald-400"></i> Candidate Marketplace
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-gray-600"></i>
            </a>
            <a href="{% url 'company_profile' %}" class="flex items-center justify-between p-3 rounded bg-white/5 hover:bg-white/10 transition border border-white/5 group">
                <div class="flex items-center gap-3 text-sm {% if 'company_profile' in request.resolver_match.url_name %}text-white font-bold{% else %}text-gray-300 group-hover:text-white{% endif %} transition">
                    <i class="fa-solid fa-building text-purple-400"></i> Company Profile
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-gray-600"></i>
            </a>
        </div>
    </div>
    
    <div class="premium-card p-6 border border-white/5 bg-[#050505]">
        <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-4">Company Info</h3>
        <div class="space-y-4 text-sm">
            <div class="flex justify-between items-center">
                <span class="text-gray-500">Name</span>
                <span class="text-white font-medium">{{ company.company_name }}</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-gray-500">Status</span>
                {% if company.is_verified %}
                    <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-green-500/20 text-green-400">Verified</span>
                {% else %}
                    <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-yellow-500/20 text-yellow-400">Pending</span>
                {% endif %}
            </div>
        </div>
    </div>
</div>
