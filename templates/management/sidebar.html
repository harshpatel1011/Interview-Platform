<!-- Sidebar -->
<div class="md:col-span-1 space-y-6 sticky top-24 self-start">
    <div class="premium-card p-6 border border-white/5 bg-[#050505]">
        <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-4">Quick Actions</h3>
        <div class="flex flex-col gap-3">
            <a href="{% url 'management_dashboard' %}" class="flex items-center justify-between p-3 rounded bg-white/5 hover:bg-white/10 transition border border-white/5 group">
                <div class="flex items-center gap-3 text-sm {% if request.resolver_match.url_name == 'management_dashboard' %}text-white font-bold{% else %}text-gray-300 group-hover:text-white{% endif %} transition">
                    <i class="fa-solid fa-chart-line text-blue-400"></i> Pipeline
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-gray-600"></i>
            </a>
            <a href="{% url 'management_candidate_list' %}" class="flex items-center justify-between p-3 rounded bg-white/5 hover:bg-white/10 transition border border-white/5 group">
                <div class="flex items-center gap-3 text-sm {% if 'candidate' in request.resolver_match.url_name %}text-white font-bold{% else %}text-gray-300 group-hover:text-white{% endif %} transition">
                    <i class="fa-solid fa-users text-green-400"></i> Candidates
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-gray-600"></i>
            </a>
            <a href="{% url 'management_interviewer_list' %}" class="flex items-center justify-between p-3 rounded bg-white/5 hover:bg-white/10 transition border border-white/5 group">
                <div class="flex items-center gap-3 text-sm {% if 'interviewer' in request.resolver_match.url_name %}text-white font-bold{% else %}text-gray-300 group-hover:text-white{% endif %} transition">
                    <i class="fa-solid fa-user-tie text-purple-400"></i> Interviewers
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-gray-600"></i>
            </a>
            <a href="{% url 'management_interview_list' %}" class="flex items-center justify-between p-3 rounded bg-white/5 hover:bg-white/10 transition border border-white/5 group">
                <div class="flex items-center gap-3 text-sm {% if 'interview_' in request.resolver_match.url_name %}text-white font-bold{% else %}text-gray-300 group-hover:text-white{% endif %} transition">
                    <i class="fa-solid fa-calendar-check text-yellow-400"></i> Interviews
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-gray-600"></i>
            </a>
        </div>
    </div>
    
    <div class="premium-card p-6 border border-white/5 bg-[#050505]">
        <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-4">Admin Info</h3>
        <div class="space-y-4 text-sm">
            <div class="flex justify-between items-center">
                <span class="text-gray-500">Logged in as</span>
                <span class="text-white font-medium">{{ user.name }}</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-gray-500">Role</span>
                <span class="text-blue-400 font-bold text-xs uppercase tracking-widest">Management</span>
            </div>
        </div>
    </div>
</div>
