{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto mt-10 animate-slide-up">
    <div class="text-center mb-8">
        <h2 class="text-3xl font-extrabold text-white mb-2">Apply as Candidate</h2>
        <p class="text-gray-400">Join the talent network. Fill in your details below.</p>
    </div>
    
    <div class="glass-panel p-8 md:p-10 rounded-2xl relative overflow-hidden shadow-2xl">
        <!-- Decor -->
        <div class="absolute top-0 right-0 w-32 h-32 bg-primary/10 rounded-full blur-3xl"></div>
        
        <form method="post" enctype="multipart/form-data" class="space-y-6 relative z-10">
            {% csrf_token %}
            
            <div class="space-y-1">
                <label class="block text-sm font-medium text-gray-300"><i class="fa-regular fa-user mr-1 text-primary"></i> Full Name</label>
                {{ form.name }}
            </div>
            
            <div class="space-y-1">
                <label class="block text-sm font-medium text-gray-300"><i class="fa-regular fa-envelope mr-1 text-primary"></i> Email Address</label>
                {{ form.email }}
                {% if form.email.errors %}
                    <p class="text-red-400 text-xs mt-1 bg-red-500/10 p-2 rounded"><i class="fa-solid fa-triangle-exclamation mr-1"></i> {{ form.email.errors.0 }}</p>
                {% endif %}
            </div>
            
            <div class="space-y-1">
                <label class="block text-sm font-medium text-gray-300"><i class="fa-solid fa-key mr-1 text-primary"></i> Password</label>
                {{ form.password }}
            </div>
            
            <div class="space-y-1">
                <label class="block text-sm font-medium text-gray-300"><i class="fa-solid fa-file-pdf mr-1 text-primary"></i> Upload Resume (PDF)</label>
                {{ form.resume }}
            </div>
            
            <button type="submit" class="w-full btn-gradient text-white font-bold py-4 px-4 rounded-xl mt-8 flex justify-center items-center gap-2 shadow-lg hover:shadow-primary/30 transition-all text-lg">
                <i class="fa-solid fa-paper-plane"></i> Submit Application
            </button>
        </form>
    </div>
</div>
{% endblock %}
