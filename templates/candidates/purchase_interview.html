{% extends 'base.html' %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center animate-slide-up px-4">
    <div class="max-w-md w-full glass-panel rounded-2xl border border-white/10 p-8 shadow-2xl relative overflow-hidden">
        <div class="absolute -right-6 -top-6 text-white/5 text-9xl"><i class="fa-solid fa-users"></i></div>
        
        <div class="relative z-10">
            <div class="w-16 h-16 rounded-full bg-purple-500/10 border border-purple-500/30 flex items-center justify-center text-purple-400 text-3xl mb-6 shadow-lg shadow-purple-500/20">
                <i class="fa-solid fa-video"></i>
            </div>
            
            <h2 class="text-2xl font-extrabold text-white mb-2 tracking-tight">Unlock Additional Interview</h2>
            <p class="text-gray-400 text-sm mb-6 leading-relaxed">
                You have already used your first free interview. To proceed with this new interview request, a fee of <strong class="text-white">₹150</strong> applies.
            </p>
            
            <div class="p-5 bg-black/40 border border-white/5 rounded-xl mb-8 space-y-3">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-gray-400">Live Interview Booking</span>
                    <span class="text-white font-medium">₹150.00</span>
                </div>
                <div class="w-full h-px bg-white/10"></div>
                <div class="flex justify-between items-center text-sm font-bold">
                    <span class="text-gray-300">Total to pay</span>
                    <span class="text-emerald-400 text-lg">₹150.00</span>
                </div>
            </div>
            
            <form method="post" action="{% url 'candidate_purchase_interview_success' %}">
                {% csrf_token %}
                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-[0_0_20px_rgba(147,51,234,0.3)] transition-all flex justify-center items-center gap-2 mb-4">
                    <i class="fa-solid fa-credit-card"></i> Pay ₹150 & Proceed
                </button>
            </form>
            
            <div class="text-center">
                <a href="{% url 'candidate_dashboard' %}" class="text-xs font-bold text-gray-500 hover:text-white uppercase tracking-wider transition">Cancel Request</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
